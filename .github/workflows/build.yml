name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        
    - name: Get version from tag
      id: version
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
        else
          VERSION="dev-$(date +%Y%m%d-%H%M%S)"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Building version: $VERSION"
        
    - name: Get build time
      id: build_time
      run: |
        BUILD_TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
        echo "time=$BUILD_TIME" >> $GITHUB_OUTPUT
        
    - name: Build for Linux and Windows
      run: |
        VERSION="${{ steps.version.outputs.version }}" COMMIT="$(git rev-parse --short HEAD)" ./build.sh
        
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/*
        body: |
          ## RealityChecker ${{ steps.version.outputs.version }}

          RealityChecker 用于发现、检测和筛选适合作为 Reality SNI 的目标网站。

          ### 本次更新

          - 新增 `serve` 和 `get` 子命令，支持 HTTP API 与 CLI 目标发现/查询能力
          - 新增 HTTP 服务端支持：CORS、SSE 流式输出、批量 REST API
          - 新增 `ProvisionService`，支持 cache-first 与 streaming target discovery
          - 重构并统一 batch 与 core 的目标过滤、排序逻辑
          - 优化扫描管道与并发控制，修复高并发下潜在死锁和性能问题
          - 改进 TLS/X25519 检测的快速路径，降低冗余握手开销
          - 增强扫描器 checkpoint / resume 能力，支持中断后继续扫描
          - 改进网络与存储层能力，包括 SQLite 资产数据库、自动表升级与更稳健的连接管理
          - 优化 UI 与输出信息，提升扫描过程可见性与诊断体验

          ### 核心能力

          - **IP 直接查询**：输入 VPS IP，自动查询所属 ASN、获取 RIPEstat 宣布网段，并按国家过滤候选 CIDR。
          - **自动扫描与筛选**：检测 TLS 1.3、X25519、HTTP/2、证书、SNI、握手延迟、重定向、地理位置和 CDN。
          - **推荐结果排序**：根据 CDN、热门网站、证书有效期、握手延迟和协议支持情况输出推荐星级。
          - **多种工作流**：支持 ASN 网段查询、单域名、批量域名、CSV 文件和 stdin 管道检测。

          ### 推荐工作流

          ```bash
          # 从 VPS IP 自动发现并筛选目标
          ./reality-checker auto 85.155.184.100 --limit 5

          # 查询 ASN 在指定国家的网段
          ./reality-checker asn AS15169 US > as15169-us.txt

          # 扫描自定义网段文件
          ./reality-checker auto --in as15169-us.txt --limit 10
          ```

          `auto` 输入单个 IPv4 会扩展为对应 `/24` 网段，IPv6 会扩展为 `/64`；输入 CIDR 时直接扫描该网段。
          `--limit` 表示最终保留的合适目标数量上限，默认值为 5。

          ### 其他用法

          ```bash
          ./reality-checker check example.com
          ./reality-checker batch example.com example.org
          ./reality-checker csv result.csv
          cat domains.txt | ./reality-checker pipe
          ```

          ### 质量状态

          - 已通过 `go test ./...`
          - 已通过 `go build ./...`

          请从下方 Assets 下载对应平台的构建产物；完整参数、配置和结果字段说明请参阅
          [README.md](https://github.com/qualvey/one-reality/blob/main/README.md)。

          > 本工具仅用于技术研究和学习，请遵守当地法律法规并合理使用网络资源。
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Upload artifacts (for non-tag builds)
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      uses: actions/upload-artifact@v4
      with:
        name: reality-checker-builds
        path: dist/
