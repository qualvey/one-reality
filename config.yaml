# REALITY 目标网站检测与选型系统 - 配置文件

# 日志系统配置
log:
  # 日志级别: debug (每请求一个 IP 即输出详细日志), info, warn, error
  level: info
  file: ""

# REALITY 目标选型过滤策略 (遵从 Xray 官方最佳实践)
reality_filter:
  # 1. 强制非 CDN 过滤 (true: 剔除 Cloudflare/Akamai/Fastly 等 CDN 节点，防止 VPS 变成公网免费反代)
  require_no_cdn: true

  # 2. 握手时间延迟上限 (毫秒): 高于此延迟的节点抛弃 (默认 800ms)
  max_handshake_ms: 400

  # 3. 热门大站过滤 (true: 依据 data/hot_websites.txt 匹配剔除 Google/Apple 等超级大站)
  require_no_hot: true

  # 4. 证书剩余有效天数下限: 默认 7 天 (剔除 7 天内到期废弃的死链，避开 30 天造成的 ACME 自动续期误杀)
  min_cert_days: 10

  # 5. 最低推荐星级门槛: (1~5 星)
  min_stars: 3

  # 6. 默认返回页过滤 (true: 识别并剔除 Nginx/OpenResty 等默认欢迎页、测试页或默认错误页)
  require_no_default_page: true

  # 7. 外部排除规则文件路径 (默认载入 data/exclude_rules.txt)
  exclude_rules_file: "data/exclude_rules.txt"

  # 8. 排除域名后缀（如未在外部文件中配置，可在此处直接注入）
  exclude_suffixes:
    - ".local"
    - ".internal"
    - ".lan"
    - ".home"
    - ".corp"
    - ".arpa"
    - ".test"
    - ".example"
    - ".invalid"
    - ".localhost"
    - ".onion"

  # 9. 明确排除的域名或证书主机名
  exclude_domains:
    - "localhost"
    - "server.domain.com"
    - "johnnasmalley.hostname"
    - "Kubernetes Ingress Controller Fake Certificate"
    - "CloudFlare Origin Certificate"
    - "FortiGate"
    - "Unspecified"

  # 10. 排除特征关键词与模式
  exclude_patterns:
    - "kubernetes"
    - "ingress controller fake certificate"
    - "fake certificate"

  # 11. 排除的 HTTP 页面状态码（被排除的状态码将被标记为不适合）
  # 例如若仅希望保留 200，可将 301/302 加入排除列表
  exclude_status:
    - 400
    - 401
    - 403
    - 404
    - 407
    - 408
    - 429
    - 500
    - 501
    - 502
    - 503
    - 504

# 网络检测配置
network:
  timeout: 3s
  retries: 1
  dns_servers:
    - "8.8.8.8"
    - "1.1.1.1"

# 并发性能配置
concurrency:
  max_concurrent: 10
  check_timeout: 3s

# 输出与格式
output:
  color: true
  verbose: false
  format: "table"
