# REALITY 目标网站检测与选型系统 - 配置文件

# 日志系统配置
log:
  # 日志级别: debug (每请求一个 IP 即输出详细日志), info, warn, error
  level: info
  file: ""

# REALITY 目标选型过滤策略 (遵从 Xray 官方最佳实践)
reality_filter:
  # ==================== 网络与运行环境策略 ====================
  # 1. 排除国内网站 (true: 默认排除国内站点；若为海外回国翻墙/访问国内流媒体，可设为 false)
  require_no_cn: true

  # 2. GFW 静态黑名单检测 (false: 本地家宽直连时建议关闭，纯靠真实网络握手连通性自然淘汰，避免静态名单误杀)
  check_gfw: false

  # 3. IP 协议族过滤 (拉取 CIDR 网段时直接过滤)
  ipv4_only: false             # 是否仅拉取与扫描 IPv4 网段 (默认 false)
  ipv6_only: false             # 是否仅拉取与扫描 IPv6 网段 (默认 false)

  # 4. 资产数据库与缓存快速通道
  use_cache: true              # 是否优先使用本地 SQLite 资产库 (默认 true)
  verify_cache: false          # 是否对本地缓存发起在线网络复核 (默认 false: 直接使用历史参数 0 延迟秒出; true: 在线并发复核)
  cache_max_days: 7            # 缓存有效天数 (默认 7)

  # ==================== 阶段二：进阶偏好过滤策略 ====================
  # 4. 强制非 CDN 过滤 (true: 剔除 Cloudflare/Akamai/Fastly 等 CDN 节点，防止 VPS 变成公网免费反代)
  require_no_cdn: true

  # 5. 握手时间延迟上限 (毫秒): 高于此延迟的节点抛弃 (默认 800ms)
  max_handshake_ms: 500

  # 6. 热门大站过滤 (true: 依据 data/hot_websites.txt 匹配剔除 Google/Apple 等超级大站)
  require_no_hot: true

  # 7. 证书剩余有效天数下限: 默认 7 天 (剔除 7 天内到期废弃的死链，避开 30 天造成的 ACME 自动续期误杀)
  min_cert_days: 10

  # 8. 最低推荐星级门槛: (1~5 星)
  min_stars: 1

  # 9. 默认返回页过滤 (true: 识别并剔除 Nginx/OpenResty 等默认欢迎页、测试页或默认错误页)
  require_no_default_page: true

  # 10. 外部排除规则文件路径 (默认载入 data/exclude_rules.txt)
  exclude_rules_file: "data/exclude_rules.txt"

  # 11. 白名单域名后缀（可选，若配置则只保留指定后缀，如只要 .com/.de）
  include_suffixes:
     - ".com"
  #   - ".de"
  #   - ".org"

  # 12. 排除域名后缀（如未在外部文件中配置，可在此处直接注入）
  exclude_suffixes:
    - ".local"
    - ".internal"
    - ".lan"
    - ".home"
    - ".corp"
    - ".arpa"
    - ".test"
    - ".example"
    - ".invalid"
    - ".localhost"
    - ".onion"

  # 13. 明确排除的域名或证书主机名
  exclude_domains:
    - "localhost"
    - "server.domain.com"
    - "johnnasmalley.hostname"
    - "Kubernetes Ingress Controller Fake Certificate"
    - "CloudFlare Origin Certificate"
    - "FortiGate"
    - "Unspecified"

  # 14. 排除特征关键词与模式
  exclude_patterns:
    - "kubernetes"
    - "ingress controller fake certificate"
    - "fake certificate"

  # 15. 排除的 HTTP 页面状态码（被排除的状态码将被标记为不适合）
  exclude_status:
    - 400
    - 401
    - 403
    - 404
    - 407
    - 408
    - 429
    - 500
    - 501
    - 502
    - 503
    - 504

# 网络检测配置
network:
  timeout: 3s
  retries: 1
  dns_servers:
    - "8.8.8.8"
    - "1.1.1.1"

# 并发性能配置
concurrency:
  max_concurrent: 10
  check_timeout: 3s

# 输出与格式
output:
  color: true
  verbose: false
  format: "table"
